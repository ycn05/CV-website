<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-commerce Project</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      background-color: #000;
      color: #fff;
      font-family: "Poppins", sans-serif;
      margin: 0;
      padding: 0;
    }

    .container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-start;
      gap: 40px;
      padding: 40px;
    }

    /* ==== SLIDESHOW ==== */
    .slideshow {
      position: relative;
      width: 700px;
      height: 400px;
      overflow: hidden;
      border-radius: 12px;
      box-shadow: 0 4px 25px rgba(255, 255, 255, 0.15);
    }

    .slides img {
      width: 100%;
      height: 100%;
      display: none;
      object-fit: cover;
      border-radius: 12px;
    }

    .slides img.active {
      display: block;
      animation: fade 1s ease-in-out;
    }

    @keyframes fade {
      from { opacity: 0.4; }
      to { opacity: 1; }
    }

    .dots {
      position: absolute;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #555;
      cursor: pointer;
    }

    .dot.active {
      background: #00bfff;
    }

    /* ==== INFO BOX ==== */
    .info-box {
      background: #111;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(255, 255, 255, 0.1);
      width: 320px;
    }

    .info-box h2 {
      margin-top: 0;
      color: #00bfff;
    }

    .info-item {
      margin: 12px 0;
      font-size: 15px;
      line-height: 1.5;
    }

    .info-item strong {
      color: #fff;
    }

    .title {
      text-align: center;
      font-size: 24px;
      font-weight: 600;
      margin-top: 25px;
      color: #00bfff;
    }
  </style>
</head>
<body>
    <h1 style="margin-left:15%;">Detail:</h1>

  <div class="container">
    <!-- Slideshow -->
    <div class="slideshow">
      <div class="slides">
        <img src="img/hmb1.jpg" class="active" alt="Project Screenshot 1">
        <img src="img/hmb2.jpg" alt="Project Screenshot 2">
        <img src="img/hmb3.jpg" alt="Project Screenshot 3">
      </div>

      <!-- Dots -->
      <div class="dots">
        <div class="dot active" onclick="showSlide(0)"></div>
        <div class="dot" onclick="showSlide(1)"></div>
        <div class="dot" onclick="showSlide(2)"></div>
      </div>
    </div>

    <!-- Info -->
    <div class="info-box">
      <h2>Project Information</h2>
      <div class="info-item"><strong>Category:</strong> E-commerce Website</div>
      <div class="info-item"><strong>Client:</strong> Supplier</div>
      <div class="info-item"><strong>Date:</strong> January 1, 2022</div>
      <h3 class="title">E-commerce Website</h3>
    </div>
  </div>

  <script>
    let currentSlide = 0;
    const slides = document.querySelectorAll('.slides img');
    const dots = document.querySelectorAll('.dot');

    function showSlide(index) {
      slides[currentSlide].classList.remove('active');
      dots[currentSlide].classList.remove('active');
      currentSlide = index;
      slides[currentSlide].classList.add('active');
      dots[currentSlide].classList.add('active');
    }

    function autoSlide() {
      let next = (currentSlide + 1) % slides.length;
      showSlide(next);
    }

    setInterval(autoSlide, 4000); // change every 4 seconds
  </script>

</body>
</html>
